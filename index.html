<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bebo.</title>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app-wrapper">

    <section id="screen-dashboard" class="screen active-screen">
      <header>
        <h1 class="logo">bebo.</h1>
        <div class="header-actions">
          <button class="icon-btn">set</button>
          <button class="icon-btn">cal</button>
        </div>
      </header>
      <main class="dashboard-main">
        <p class="cycle-day">cycle day <span id="cycle-day-number">12</span></p>
        <h2 id="cycle-phase">phase</h2>
        <p id="cycle-message">message below phase</p>
        <div class="placeholder illustration">[image]</div>
        <button class="pill-btn">log period today</button>
      </main>
      <footer>
        <div class="placeholder week-strip">[week strip here]</div>
      </footer>
    </section>

    <section id="screen-calender" class="screen">
      <header>
        <button class="icon-btn">back</button>
        <button class="icon-btn">settings</button>
      </header>
      <h2 class="month-title">october 2026</h2>
      <p class="weekday-row">M T W T F S S</p>
      <div class="placeholder month-grid">[month grid here]</div>
    </section>

    <section id="screen-settings" class="screen">
      <header>
        <button class="icon-btn">back</button>
        <h2 class="page-title">preferences</h2>
        <div class="header-spacer"></div>
      </header>
      <h3>cycle lengths</h3>
      <label for="period-length">period duration</label>
      <input type="number" id="period-length" value="5">
      <label for="cycle-length">cycle length</label>
      <input type="number" id="cycle-length" value="28">
    </section>

  </div>
</body>

</html>
