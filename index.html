<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bebo.</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app-wrapper">

    <section id="screen-dashboard" class="screen active-screen">
      <header>
        <h1 class="logo">bebo.</h1>
        <div class="header-actions">
          <button class="icon-btn" onclick="navTo('settings')">
            <img src="icon/set.png" alt="settings" class="custom-icon">
          </button>
          <button class="icon-btn" onclick="navTo('calender')">
            <img src="icon/cal.png" alt="calender" class="custom-icon">
          </button>
        </div>
      </header>
      <main class="dashboard-main">
        <p class="cycle-day">cycle day <span id="cycle-day-number">-</span></p>
        <h2 id="cycle-phase">welcome</h2>
        <p id="cycle-message">tap the gear icon to log your dates.</p>
        <div class="illustration">
          <img id="cat-image" src="cat/lut.png" alt="" class="cat-illustration">
        </div>
        <button id="quick-action-btn" class="pill-btn" onclick="handleQuickAction()">set up data</button>
      </main>
      <footer>
        <div class="placeholder week-strip">[week strip here]</div>
      </footer>
    </section>

    <section id="screen-calender" class="screen">
      <header>
        <button class="icon-btn" onclick="navTo('dashboard')">
          <img src="icon/back.png" alt="back" class="custom-icon">
        </button>
        <button class="icon-btn" onclick="navTo('settings')">
          <img src="icon/set.png" alt="settings" class="custom-icon">
        </button>
      </header>
      <div class="month-header">
        <button id="prev-month-btn" class="nav-arrow" onclick="changeMonth(-1)">
          <img src="icon/prev.png" alt="previous month">
        </button>
        <h2 id="calender-month-title" class="month-title">october 2026</h2>
        <button id="next-month-btn" class="nav-arrow" onclick="changeMonth(1)">
          <img src="icon/next.png" alt="next month">
        </button>
      </div>
      <div class="weekday-row">
        <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
      </div>
      <div id="calender-grid" class="calender-grid"></div>
    </section>

    <section id="screen-settings" class="screen">
      <header>
        <button class="icon-btn" onclick="navTo('dashboard')">
          <img src="icon/back.png" alt="back" class="custom-icon">
        </button>
        <h2 class="page-title">preferences</h2>
        <div class="header-spacer"></div>
      </header>

      <div class="settings-section">
        <h3>cycle lengths</h3>
        <label for="period-length">period duration</label>
        <input type="number" id="period-length" min="1" max="10" value="5" onchange="saveSettings()">
        <label for="cycle-length">cycle length</label>
        <input type="number" id="cycle-length" min="20" max="45" value="28" onchange="saveSettings()">
      </div>

      <div class="settings-section">
        <h3>log past periods</h3>
        <p class="settings-desc">tap every day of bleeding to build your history.</p>
        <div class="settings-cal-wrapper">
          <div class="month-header">
            <button id="settings-prev-month-btn" class="nav-arrow" onclick="changeSettingsMonth(-1)">
              <img src="icon/prev.png" alt="previous month">
            </button>
            <h4 id="settings-month-title" class="month-title">october 2026</h4>
            <button id="settings-next-month-btn" class="nav-arrow" onclick="changeSettingsMonth(1)">
              <img src="icon/next.png" alt="next month">
            </button>
          </div>
          <div class="weekday-row">
            <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
          </div>
          <div id="settings-calender-grid" class="calender-grid"></div>
        </div>
      </div>
    </section>

  </div>
  <script src="app.js"></script>
</body>

</html>
