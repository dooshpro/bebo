<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bebo.</title>
</head>

<body>
  <section id="screen-dashboard">
    <header>
      <h1>bebo.</h1>
      <button>settings</button>
      <button>calender</button> 
    </header> 
    <main>
      <p>cycle day <span id="cycle-day-number">12</span></p>
      <h2 id="cycle-phase">phase</h2>
      <p id="cycle-message">message below phase</p>
      <p>[image]</p>
      <button>log period today</button>
    </main>
    <footer>
      <p>[week strip here]</p>
    </footer>
  </section>
  <section id="screen-calender">
    <header>
      <button>back</button>
      <button>settings</button>
    </header>
    <h2>ocotber 2026</h2>
    <p>M T W T F S S</p>
    <p>[month grid here]</p>
  </section>
  <section id="screen-settings">
    <header>
      <button>back</button>
      <h2>preferences</h2>
    </header>
    <h3>cycle lengths</h3>
    <label for="period-length">period duration</label>
    <input type="number" id="period-length" value="5">
    <label for="cycle-length">cycle length</label>
    <input type="number" id="cycle-length" value="28">
  </section>
</body>

</html>
